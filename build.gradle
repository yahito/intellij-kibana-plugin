plugins {
    id 'java'
    id "org.jetbrains.kotlin.jvm" version '1.9.21'
    id "org.jetbrains.intellij" version "1.17.4"
}
sourceSets {
    main.java.srcDirs = ['src/main/java']
    main.kotlin.srcDirs = ['src/main/java', 'src/main/kotLin']
    main.resources.srcDirs = ['src/main/resources']
}
patchPluginXml {
    sinceBuild.set("233") // Updated to match the 2023.3 version
    untilBuild.set("241.*") // Updated to support current versions
}
repositories {
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    maven {
        url 'https://dl.bintray.com/jetbrains/intellig-plugin-service'
    }
    maven {
        url "https://cache-redirector.jetbrains.com/jetbrains.bintray.com/intellig-third-party-dependencies"
    }
}
intellij {
    plugins.set(['com.intellij.java', 'Kotlin'])
    version.set('2023.3') // Updated to a more recent version
    type.set('IC') // Community Edition
}
repositories {
    mavenCentral()
}

// Configure JVM toolchain for consistent Java compilation
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

// Configure Kotlin compilation to use the same Java version
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
    kotlinOptions {
        jvmTarget = "17"
    }
}

ext.kotlin_version = '1.9.21'
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.11'
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
}
wrapper {
    gradleVersion = '8.5.1'
    distributionUrl = "https://cache-redirector.jetbrains.com/services.gradle.org/distributions/gradle-${gradleVersion}-all.zip"
}